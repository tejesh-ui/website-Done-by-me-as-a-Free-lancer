<!-- REUSABLE COMPONENT: GALLERY CARD -->
<!-- To modify gallery card markup, edit this file. -->
<figure class="gallery-card" data-category="{{category}}" data-index="{{index}}" tabindex="0" role="button" aria-label="View photo {{title}}">
  <img src="{{image}}" alt="{{title}}" class="gallery-img" loading="lazy">
  <div class="gallery-overlay">
    <span class="gallery-cat-badge">{{category}}</span>
    <figcaption class="gallery-item-title">{{title}}</figcaption>
    <div class="gallery-zoom-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </div>
  </div>
</figure>
