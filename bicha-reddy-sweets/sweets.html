<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse Sweets demo's traditional pure ghee sweets.">
    <title>Sweets | Sweets demo</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="vendor/phosphor/style.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans relative">
    <div id="site-header"></div>
    <main>
        <section class="page-hero py-12 md:py-16">
            <div class="max-w-[1400px] mx-auto px-4 md:px-8">
                <p class="text-accent-gold font-medium tracking-widest text-sm uppercase mb-3">Our Collection</p>
                <h1 class="font-serif text-4xl md:text-5xl font-bold text-neutral-900 mb-4">Traditional Sweets</h1>
                <p class="text-neutral-800 max-w-2xl">Discover familiar Indian mithai prepared with rich ingredients, pure ghee and a love for tradition.</p>
                <p class="text-sm text-neutral-600 mt-4"><a href="index.html" class="hover:text-primary">Home</a> <span aria-hidden="true">/</span> Sweets</p>
            </div>
        </section>
        <section class="py-12 md:py-16 bg-neutral-100">
            <div class="max-w-[1400px] mx-auto px-4 md:px-8">
                <div class="flex overflow-x-auto hide-scrollbar gap-2 md:gap-4 mb-10 justify-start md:justify-center border-b border-neutral-300 pb-3" aria-label="Filter sweets by category">
                    <button type="button" class="filter-btn active px-4 py-2 rounded-full text-sm font-medium bg-primary text-white whitespace-nowrap" data-filter="All">All Sweets</button>
                    <button type="button" class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-neutral-100 text-neutral-800 border border-neutral-300 whitespace-nowrap" data-filter="Laddu">Laddu</button>
                    <button type="button" class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-neutral-100 text-neutral-800 border border-neutral-300 whitespace-nowrap" data-filter="Kaju">Kaju</button>
                    <button type="button" class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-neutral-100 text-neutral-800 border border-neutral-300 whitespace-nowrap" data-filter="Dry Fruit">Dry Fruit</button>
                    <button type="button" class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-neutral-100 text-neutral-800 border border-neutral-300 whitespace-nowrap" data-filter="Halwa">Halwa</button>
                    <button type="button" class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-neutral-100 text-neutral-800 border border-neutral-300 whitespace-nowrap" data-filter="Burfi">Burfi</button>
                    <button type="button" class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-neutral-100 text-neutral-800 border border-neutral-300 whitespace-nowrap" data-filter="Special">Special</button>
                </div>
                <div id="sweets-container" data-product-grid data-limit="5" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 lg:gap-8"></div>
                <div class="text-center mt-10">
                    <button type="button" data-view-more-for="sweets-container" aria-controls="sweets-container" aria-expanded="false" class="bg-primary text-white px-8 py-3 rounded-sm font-medium hover:bg-primary-hover transition-colors">View More</button>
                </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <div id="site-search"></div>
    <script src="components/logo.js"></script>
    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/search.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
