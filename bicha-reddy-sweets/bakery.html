<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore fresh bakery treats from Sweets demo.">
    <title>Bakery | Sweets demo</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="vendor/phosphor/style.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans relative">
    <div id="site-header"></div>
    <main>
        <section class="page-hero py-12 md:py-16">
            <div class="max-w-[1400px] mx-auto px-4 md:px-8">
                <p class="text-accent-gold font-medium tracking-widest text-sm uppercase mb-3">Freshly Baked</p>
                <h1 class="font-serif text-4xl md:text-5xl font-bold text-neutral-900 mb-4">From Our Bakery</h1>
                <p class="text-neutral-800 max-w-2xl">Explore everyday bakes, celebration cakes and savory bakery favorites.</p>
                <p class="text-sm text-neutral-600 mt-4"><a href="index.html" class="hover:text-primary">Home</a> <span aria-hidden="true">/</span> Bakery</p>
            </div>
        </section>
        <section class="py-12 md:py-16 bg-neutral-100">
            <div class="max-w-[1400px] mx-auto px-4 md:px-8">
                <div id="bakery-container" data-product-grid data-limit="5" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 lg:gap-8"></div>
                <div class="text-center mt-10">
                    <button type="button" data-view-more-for="bakery-container" aria-controls="bakery-container" aria-expanded="false" class="bg-primary text-white px-8 py-3 rounded-sm font-medium hover:bg-primary-hover transition-colors">View More</button>
                </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <div id="site-search"></div>
    <script src="components/logo.js"></script>
    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/search.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
